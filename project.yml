name: Thread
options:
  bundleIdPrefix: com.thread
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.25"
    CURRENT_PROJECT_VERSION: "29"
    GENERATE_INFOPLIST_FILE: NO
targets:
  Thread:
    type: application
    platform: macOS
    sources:
      - path: Thread
      # Bundled so the MIT/BSD/Zlib notices ship with every copy of the app,
      # as those licenses require of binary redistributions.
      - path: THIRD-PARTY-NOTICES.md
        buildPhase: resources
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thread.app
        PRODUCT_NAME: Thread
        INFOPLIST_FILE: Thread/Info.plist
        CODE_SIGN_ENTITLEMENTS: Thread/Thread.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: HHBVQNWU3D
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.thread.app.dev
          PRODUCT_NAME: Thread Dev
